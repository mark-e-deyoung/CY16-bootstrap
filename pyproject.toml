[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cy16-compiler-bootstrap"
version = "0.1.0"
description = "Bootstrap tools and docs for a CY16 assembler/compiler project"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "SemperSupra CY16 bootstrap"}]

[project.scripts]
cy16-as = "cy16boot.asm:main"
cy16-dis = "cy16boot.dis:main"
cy16-sim = "cy16boot.sim:main"
cy16-scan-decode = "cy16boot.scan:decode_main"
cy16-scanwrap = "cy16boot.scan:wrap_main"
cy16-cc-mini = "cy16boot.ccmini:main"
cy16-cc = "cy16cc.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
