name: CY16 Validation Ladder

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ci.yml'
      - 'Dockerfile'
      - 'Makefile'
      - 'pyproject.toml'
      - 'src/**'
      - 'include/**'
      - 'libcy16/**'
      - 'tests/**'
      - 'examples/**'
      - 'codegen_rewrite.py'
      - 'run_chibicc_test.py'
      - 'run_test_v0.py'
      - 'test*.py'
      - 'test*.c'
      - 'test*.s'
      - 'chibicc'
      - 'cy16_codegen.o'
      - 'scripts/bootstrap.ps1'
      - 'scripts/run_docker.ps1'
      - 'scripts/run_smoke.sh'
      - 'scripts/vendor_chibicc.sh'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/ci.yml'
      - 'Dockerfile'
      - 'Makefile'
      - 'pyproject.toml'
      - 'src/**'
      - 'include/**'
      - 'libcy16/**'
      - 'tests/**'
      - 'examples/**'
      - 'codegen_rewrite.py'
      - 'run_chibicc_test.py'
      - 'run_test_v0.py'
      - 'test*.py'
      - 'test*.c'
      - 'test*.s'
      - 'chibicc'
      - 'cy16_codegen.o'
      - 'scripts/bootstrap.ps1'
      - 'scripts/run_docker.ps1'
      - 'scripts/run_smoke.sh'
      - 'scripts/vendor_chibicc.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install pycparser
        pip install -e .

    - name: Build C-based Compiler
      run: |
        make -C . clean
        make -C . CC=gcc

    - name: Run Python-based Tests
      run: pytest -q

    - name: Build and Run Setup Stub (Validation Anchor)
      run: |
        mkdir -p build
        cy16-as examples/setup_stub.s -o build/setup_stub.bin --base 0x1000 --lst build/setup_stub.lst --map build/setup_stub.map
        cy16-dis build/setup_stub.bin --base 0x1000
        cy16-sim build/setup_stub.bin --base 0x1000 --pc 0x1000 --dump 0xc03a
        cy16-scanwrap build/setup_stub.bin build/setup_stub.scan 0x1000
        cy16-scan-decode build/setup_stub.scan

    - name: Verify C-based Compiler with Simulator
      run: |
        ./chibicc examples/c/write_memctl.c -S > build/write_memctl.s
        cy16-as build/write_memctl.s -o build/write_memctl.bin --base 0x1000
        cy16-sim build/write_memctl.bin --base 0x1000 --pc 0x1000 --dump 0xc03a
