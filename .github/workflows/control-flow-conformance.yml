name: CY16 Control-Flow Conformance

on:
  pull_request:
    paths:
      - 'src/cy16boot/**'
      - 'src/cy16cc/**'
      - 'tests/**'
      - 'docs/ISA_CONFORMANCE_MATRIX.md'
      - '.github/workflows/control-flow-conformance.yml'
  push:
    branches: [main]
    paths:
      - 'src/cy16boot/**'
      - 'tests/**'
      - '.github/workflows/control-flow-conformance.yml'

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pycparser
          pip install -e .
      - name: Build C-based compiler
        run: |
          make clean
          make CC=gcc
      - name: Run full validation suite
        run: pytest -q
      - name: Exercise control-flow tools directly
        run: |
          mkdir -p build
          cat > build/control-flow.s <<'EOF'
          .org 0x1000
              mov r0, 3
          loop:
              dec r0
              jnz.s loop
              int 0x40
              ret
          EOF
          cy16-as build/control-flow.s -o build/control-flow.bin --base 0x1000 \
            --lst build/control-flow.lst --map build/control-flow.map
          cy16-dis build/control-flow.bin --base 0x1000
