name: CY16 Container and Portable DX

on:
  pull_request:
    paths:
      - '.dockerignore'
      - 'Dockerfile'
      - 'Makefile'
      - 'pyproject.toml'
      - 'src/**'
      - 'include/**'
      - 'libcy16/**'
      - 'examples/**'
      - 'tests/**'
      - 'scripts/dev.py'
      - 'scripts/dev.sh'
      - 'scripts/dev.ps1'
      - 'scripts/bootstrap.sh'
      - 'scripts/bootstrap.ps1'
      - 'scripts/run_docker.ps1'
      - '.github/workflows/container-dx.yml'
  push:
    branches: [ main ]
    paths:
      - '.dockerignore'
      - 'Dockerfile'
      - 'Makefile'
      - 'pyproject.toml'
      - 'src/**'
      - 'include/**'
      - 'libcy16/**'
      - 'examples/**'
      - 'tests/**'
      - 'scripts/dev.py'
      - 'scripts/dev.sh'
      - 'scripts/dev.ps1'
      - 'scripts/bootstrap.sh'
      - 'scripts/bootstrap.ps1'
      - 'scripts/run_docker.ps1'
      - '.github/workflows/container-dx.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-dx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax check portable launcher
        run: python3 -m py_compile scripts/dev.py

      - name: Host doctor
        run: python3 scripts/dev.py doctor

      - name: Build isolated validation target
        run: docker build --target test -t cy16-bootstrap:test .

      - name: Build minimal runtime
        run: docker build --target runtime -t cy16-bootstrap:ci .

      - name: Record base-image digest
        run: |
          docker pull debian:trixie-slim
          docker image inspect debian:trixie-slim --format '{{json .RepoDigests}}'

      - name: Enforce runtime shape
        run: |
          python3 - <<'PY'
          import json, subprocess
          raw = subprocess.check_output(['docker', 'image', 'inspect', 'cy16-bootstrap:ci'], text=True)
          image = json.loads(raw)[0]
          cfg = image['Config']
          user = cfg.get('User') or ''
          volumes = cfg.get('Volumes')
          if not user or user in {'0', 'root', '0:0'}:
              raise SystemExit(f'final image must default non-root; got {user!r}')
          if volumes:
              raise SystemExit(f'final image must not declare persistent volumes: {volumes!r}')
          size = int(image['Size'])
          ceiling = 384 * 1024 * 1024
          print(f'Runtime image size: {size} bytes ({size / 1024 / 1024:.1f} MiB)')
          if size > ceiling:
              raise SystemExit(f'final image exceeds {ceiling} byte ceiling')
          PY

      - name: Runtime smoke test
        run: |
          docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --entrypoint /bin/sh cy16-bootstrap:ci -c \
            'command -v cy16-cc && command -v cy16-chibicc && command -v cy16-as && command -v cy16-sim'
          docker run --rm --read-only --network none --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            cy16-bootstrap:ci --version

      - name: Portable wrapper smoke test
        run: |
          mkdir -p build
          CY16_IMAGE=cy16-bootstrap:ci python3 scripts/dev.py tool cy16-as \
            examples/setup_stub.s -o build/dev-wrapper.bin --base 0x1000
          test -s build/dev-wrapper.bin

  windows-launcher-surface:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Parse PowerShell wrappers
        shell: powershell
        run: |
          foreach ($path in @('.\scripts\dev.ps1','.\scripts\bootstrap.ps1','.\scripts\run_docker.ps1')) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$null,[ref]$errors)
            if ($errors.Count -ne 0) { $errors | Format-List | Out-String | Write-Error; exit 1 }
          }

      - name: Validate Python and PowerShell launcher help
        shell: powershell
        run: |
          python -m py_compile .\scripts\dev.py
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\dev.ps1 --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate doctor diagnostic surface without requiring Docker Desktop
        shell: powershell
        run: |
          $script = (Resolve-Path '.\scripts\dev.ps1').Path
          $stdout = Join-Path $env:RUNNER_TEMP 'cy16-doctor.stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'cy16-doctor.stderr.txt'
          $process = Start-Process -FilePath 'powershell.exe' `
            -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',$script,'doctor') `
            -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $outText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
          $errText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
          $text = $outText + "`n" + $errText
          Write-Host $text
          if ($process.ExitCode -notin @(0,2)) { throw "unexpected doctor exit code $($process.ExitCode)" }
          if ($text -notmatch 'Repository:' -or $text -notmatch 'Host:') { throw 'doctor did not produce expected diagnostic surface' }

  macos-launcher-surface:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Validate POSIX and Python launchers
        run: |
          sh -n scripts/dev.sh
          test -x scripts/dev.sh
          python3 -m py_compile scripts/dev.py
          ./scripts/dev.sh --help

      - name: Validate doctor diagnostic surface without Docker Desktop
        run: |
          set +e
          output=$(./scripts/dev.sh doctor 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          test "$code" -eq 2 -o "$code" -eq 0
          printf '%s\n' "$output" | grep -F 'Repository:'
          printf '%s\n' "$output" | grep -F 'Host:'
